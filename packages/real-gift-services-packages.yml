description: >-
  First-party RealGifts SDKs advertised on the RealGifts developer surface. The
  homepage and developer section state: "One snippet. SDKs for JavaScript,
  Node.js, PHP, Python, Ruby, Perl, iOS, Android, and more. Full REST API."
  Registry coordinates (npm/PyPI/Packagist/etc.) are not published on the public
  marketing pages and the documentation portal is gated behind a bot challenge,
  so package names are recorded as documented-but-unresolved rather than
  invented. The browser SDK is loaded via a hosted script and initialized with
  an API key (RealGifts.init({ api_key: 'YOUR_API_KEY' })).
loader:
  browser_snippet: |
    <!-- Add the RealGifts SDK -->
    <script src="https://www.getrealgifts.com/sdk/realgifts.js"></script>
    <!-- Initialize with your API key -->
    <script>
      RealGifts.init({ api_key: 'YOUR_API_KEY', ... });
    </script>
