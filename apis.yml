    RealGifts full REST API for embedding a gift shop, reward store, and
    wishlist into a platform: browse a 1M+ gift catalog, create and send gifts,
    handle privacy-preserving recipient redemption, and track commissions.
    Authenticated with an API key, with webhooks for order/redemption events and
    first-party SDKs across JavaScript, Node.js, PHP, Python, Ruby, Perl, iOS,
    and Android.
