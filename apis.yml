description: >-
  RealGifts (Real Gift Services) is a Gifting-as-a-Service (GaaS) and G-Commerce
  platform, operating since 2008, that lets platforms and apps embed a turnkey
  gift shop, reward store, and wishlist experience in minutes. Its curated
  catalog spans more than one million gifts across hundreds of brands, sold
  through drop-in widgets, badges, and buttons or a full REST API with webhooks
  and SDKs for JavaScript, Node.js, PHP, Python, Ruby, Perl, iOS, and Android.
  Platforms integrate once, white-label the storefront, checkout, and email,
  and earn commissions on every order while RealGifts handles payments,
  shipping, redemption, multi-currency display, international delivery, and
  recipient-privacy-preserving gift claiming. RealGifts was an fbFund recipient,
  was built for the Facebook Gift Shop, and has been featured in TIME and Fast
  Company.
